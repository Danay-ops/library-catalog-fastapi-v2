# Исключить различные часто игнорируемые директории.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# То же самое, что и Black.
line-length = 88

# Предполагается Python 3.10.
target-version = "py310"

[lint]
# Включить коды pycodestyle (`E`) и Pyflakes (`F`) по умолчанию.
select = ["E", "F"]

# Игнорировать нарушения длины строк.
ignore = ["E501"]

# Разрешить автоматическое исправление для всех включенных правил (когда `--fix`) предоставлено.
fixable = ["A", "B", "C", "D", "E", "F"]
unfixable = []

# Разрешить неиспользуемые переменные, когда они начинаются с подчеркивания.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Разрешить неиспользуемые импорты в файлах __init__.py.
"__init__.py" = ["F401"]

[lint.mccabe]
# В отличие от Flake8, по умолчанию уровень сложности равен 10.
max-complexity = 10